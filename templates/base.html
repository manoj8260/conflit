<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Flask Auth Demo{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-xrRywqdh7+psJ0R+XvC19cgi8E0uH6zMVutv5I2/QpZVnDRWn3O9UZvN41PCe3nH"
      crossorigin="anonymous"
    />
  </head>
  <body class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-GFrc36q9h1g0hYvDCzcx5Qe1CF1F87VKy4Zn66B2t+7HlgBqypZWSJYukcIYvZqE"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
